name: Build iOS & Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  # ═══════════════════════════════════════════
  # iOS: unsigned IPA (Sideloadly/AltStore用)
  # ═══════════════════════════════════════════
  build-ios:
    name: iOS Build (unsigned IPA)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove expo-dev-client for unsigned build
        run: npx expo install --fix && npm uninstall expo-dev-client

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS archive (unsigned)
        run: |
          cd ios
          xcodebuild archive \
            -workspace newkakeibo.xcworkspace \
            -scheme newkakeibo \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -archivePath "$GITHUB_WORKSPACE/build/newkakeibo.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_PREVIEWS=NO \
            2>&1 | tail -80

      - name: Package IPA
        run: |
          ARCHIVE="build/newkakeibo.xcarchive"
          
          # Archive の中身をデバッグ
          echo "=== Archive contents ==="
          find "$ARCHIVE/Products" -maxdepth 3 -type d 2>/dev/null || true
          
          # .app を探す
          APP_PATH=$(find "$ARCHIVE/Products" -name "*.app" -type d | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found in archive, trying build dir..."
            APP_PATH=$(find build -name "*.app" -type d | head -1)
          fi
          
          echo "Found app at: $APP_PATH"
          echo "=== .app contents ==="
          ls -la "$APP_PATH/" | head -20
          
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "Info.plist not at root, searching..."
            find "$APP_PATH" -name "Info.plist" -type f
            # Expo/RN は Info.plist を embedded にすることがある
            # PLIST を生成して埋め込む
            BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist" 2>/dev/null || echo "com.newkakeibo.app")
            echo "Bundle ID: $BUNDLE_ID"
          fi
          
          # IPA パッケージング
          mkdir -p Payload
          cp -a "$APP_PATH" Payload/
          
          # 確認
          echo "=== Payload contents ==="
          ls -la Payload/
          ls -la Payload/*.app/ | head -10
          
          zip -r -q newkakeibo-unsigned.ipa Payload
          echo "IPA size: $(du -h newkakeibo-unsigned.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: newkakeibo-ios-unsigned
          path: newkakeibo-unsigned.ipa
          retention-days: 30

  # ═══════════════════════════════════════════
  # Android: Debug APK
  # ═══════════════════════════════════════════
  build-android:
    name: Android Build (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: newkakeibo-android
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
