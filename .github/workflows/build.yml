name: Build iOS & Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  # ═══════════════════════════════════════════
  # iOS: unsigned IPA (Sideloadly/AltStore用)
  # ═══════════════════════════════════════════
  build-ios:
    name: iOS Build (unsigned IPA)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove expo-dev-client for unsigned build
        run: npx expo install --fix && npm uninstall expo-dev-client

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS app (unsigned)
        run: |
          cd ios
          xcodebuild build \
            -workspace newkakeibo.xcworkspace \
            -scheme newkakeibo \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_PREVIEWS=NO \
            2>&1 | tail -50

      - name: Debug and Package IPA
        run: |
          echo "=== Searching for .app bundles ==="
          find ios/build -name "*.app" -type d 2>/dev/null
          
          APP_PATH=$(find ios/build/Build/Products -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "FATAL: No .app found anywhere in ios/build"
            find ios/build -maxdepth 5 -type d
            exit 1
          fi
          
          echo "Found .app at: $APP_PATH"
          APP_NAME=$(basename "$APP_PATH")
          echo "App bundle name: $APP_NAME"
          
          echo "=== Top-level .app contents ==="
          ls -la "$APP_PATH/"
          
          # 実行ファイルの存在確認
          echo "=== Executable files in .app root ==="
          find "$APP_PATH" -maxdepth 1 -type f -perm +111 2>/dev/null || \
          find "$APP_PATH" -maxdepth 1 -type f ! -name "*.plist" ! -name "*.car" ! -name "*.png" ! -name "*.nib" ! -name "*.storyboardc" ! -name "*.strings" ! -name "*.json" ! -name "*.js" ! -name "*.jsbundle" 2>/dev/null | head -10
          
          echo "=== Checking Info.plist ==="
          if [ -f "$APP_PATH/Info.plist" ]; then
            echo "✅ Info.plist found"
            
            # Info.plist 内容を表示
            echo "--- Raw Info.plist (partial) ---"
            head -30 "$APP_PATH/Info.plist"
            
            # $(PRODUCT_BUNDLE_IDENTIFIER) などの未解決変数を sed で置換
            echo "Resolving Xcode variables in Info.plist..."
            sed -i '' 's/\$(PRODUCT_BUNDLE_IDENTIFIER)/com.newkakeibo.app/g' "$APP_PATH/Info.plist"
            sed -i '' 's/\$(PRODUCT_NAME)/newkakeibo/g' "$APP_PATH/Info.plist"
            sed -i '' 's/\$(PRODUCT_NAME:rfc1034identifier)/newkakeibo/g' "$APP_PATH/Info.plist"
            sed -i '' 's/\$(PRODUCT_MODULE_NAME)/newkakeibo/g' "$APP_PATH/Info.plist"
            sed -i '' 's/\$(MARKETING_VERSION)/1.0.0/g' "$APP_PATH/Info.plist"
            sed -i '' 's/\$(CURRENT_PROJECT_VERSION)/1/g' "$APP_PATH/Info.plist"
            sed -i '' 's/\$(DEVELOPMENT_TEAM)//g' "$APP_PATH/Info.plist"
            
            # 残留チェック
            if grep -q '\$(' "$APP_PATH/Info.plist"; then
              echo "⚠️ Remaining unresolved variables:"
              grep '\$(' "$APP_PATH/Info.plist"
              # 残りの $(...) をすべて空文字に置換
              sed -i '' 's/\$([^)]*)//g' "$APP_PATH/Info.plist"
            fi
          else
            echo "❌ Info.plist NOT found — generating from prebuild source"
            # Expo prebuild のソース Info.plist をコピーして変数解決
            if [ -f "ios/newkakeibo/Info.plist" ]; then
              cp "ios/newkakeibo/Info.plist" "$APP_PATH/Info.plist"
              sed -i '' 's/\$(PRODUCT_BUNDLE_IDENTIFIER)/com.newkakeibo.app/g' "$APP_PATH/Info.plist"
              sed -i '' 's/\$(PRODUCT_NAME)/newkakeibo/g' "$APP_PATH/Info.plist"
              sed -i '' 's/\$(PRODUCT_NAME:rfc1034identifier)/newkakeibo/g' "$APP_PATH/Info.plist"
              sed -i '' 's/\$(PRODUCT_MODULE_NAME)/newkakeibo/g' "$APP_PATH/Info.plist"
              sed -i '' 's/\$(MARKETING_VERSION)/1.0.0/g' "$APP_PATH/Info.plist"
              sed -i '' 's/\$(CURRENT_PROJECT_VERSION)/1/g' "$APP_PATH/Info.plist"
              sed -i '' 's/\$(DEVELOPMENT_TEAM)//g' "$APP_PATH/Info.plist"
              sed -i '' 's/\$([^)]*)//g' "$APP_PATH/Info.plist"
            fi
          fi
          
          # 最終 Info.plist 検証
          echo "=== Final Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist" || true
          EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist" 2>/dev/null || echo "")
          echo "CFBundleExecutable: $EXEC_NAME"
          
          # 実行ファイル名の一致確認
          if [ -n "$EXEC_NAME" ] && [ -f "$APP_PATH/$EXEC_NAME" ]; then
            echo "✅ Executable '$EXEC_NAME' found"
          elif [ -n "$EXEC_NAME" ]; then
            echo "⚠️ Executable '$EXEC_NAME' NOT found, searching..."
            find "$APP_PATH" -maxdepth 1 -type f | head -20
            # フォールバック: 実在する実行ファイル名をInfo.plistに設定
            REAL_EXEC=$(find "$APP_PATH" -maxdepth 1 -type f -perm +111 -not -name ".*" 2>/dev/null | head -1)
            if [ -n "$REAL_EXEC" ]; then
              REAL_EXEC_NAME=$(basename "$REAL_EXEC")
              echo "Setting CFBundleExecutable to actual binary: $REAL_EXEC_NAME"
              /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable $REAL_EXEC_NAME" "$APP_PATH/Info.plist"
            fi
          fi
          
          echo "=== Final validation ==="
          plutil -lint "$APP_PATH/Info.plist"
          
          # IPA パッケージング
          mkdir -p Payload
          cp -a "$APP_PATH" "Payload/$APP_NAME"
          
          echo "=== Payload/$APP_NAME contents ==="
          ls -la "Payload/$APP_NAME/" | head -20
          
          # zip -y でsymlink保持
          zip -y -r -q newkakeibo-unsigned.ipa Payload
          
          # IPA 検証
          echo "=== IPA entries ==="
          unzip -l newkakeibo-unsigned.ipa | grep -E "Info\.plist|newkakeibo$" | head -10
          echo "IPA size: $(du -h newkakeibo-unsigned.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: newkakeibo-ios-unsigned
          path: newkakeibo-unsigned.ipa
          retention-days: 30

  # ═══════════════════════════════════════════
  # Android: Debug APK
  # ═══════════════════════════════════════════
  build-android:
    name: Android Build (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: newkakeibo-android
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
