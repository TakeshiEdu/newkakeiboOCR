name: Build iOS & Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  # ═══════════════════════════════════════════
  # iOS: unsigned IPA (Sideloadly/AltStore用)
  # ═══════════════════════════════════════════
  build-ios:
    name: iOS Build (unsigned IPA)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove expo-dev-client for unsigned build
        run: npx expo install --fix && npm uninstall expo-dev-client

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS app (unsigned)
        run: |
          cd ios
          xcodebuild build \
            -workspace newkakeibo.xcworkspace \
            -scheme newkakeibo \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.newkakeibo.app \
            GENERATE_INFOPLIST_FILE=NO \
            ENABLE_PREVIEWS=NO \
            2>&1 | tail -50

      - name: Debug and Package IPA
        run: |
          echo "=== Searching for .app bundles ==="
          find ios/build -name "*.app" -type d 2>/dev/null
          
          APP_PATH=$(find ios/build/Build/Products -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "FATAL: No .app found anywhere in ios/build"
            find ios/build -maxdepth 5 -type d
            exit 1
          fi
          
          echo "Found .app at: $APP_PATH"
          APP_NAME=$(basename "$APP_PATH")
          echo "App bundle name: $APP_NAME"
          
          echo "=== Top-level .app contents ==="
          ls -la "$APP_PATH/"
          
          echo "=== Checking Info.plist ==="
          if [ -f "$APP_PATH/Info.plist" ]; then
            echo "✅ Info.plist found in built .app"
            BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist" 2>/dev/null || echo "")
            echo "Bundle ID: $BUNDLE_ID"
            
            # 未解決の Xcode 変数 $(…) が残っていないかチェック
            if grep -q '\$(' "$APP_PATH/Info.plist"; then
              echo "⚠️ Unresolved Xcode variables found! Regenerating..."
              rm "$APP_PATH/Info.plist"
            fi
          fi
          
          # Info.plist が無い or 変数未解決の場合、解決済みplistを生成
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "Generating resolved Info.plist..."
            /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.newkakeibo.app" "$APP_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleName string newkakeibo" "$APP_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string newkakeibo" "$APP_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string newkakeibo" "$APP_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1" "$APP_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0.0" "$APP_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$APP_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleInfoDictionaryVersion string 6.0" "$APP_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 16.0" "$APP_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleSupportedPlatforms array" "$APP_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleSupportedPlatforms:0 string iPhoneOS" "$APP_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily array" "$APP_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:0 integer 1" "$APP_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:1 integer 2" "$APP_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :UIRequiredDeviceCapabilities array" "$APP_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :UIRequiredDeviceCapabilities:0 string arm64" "$APP_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :UILaunchStoryboardName string SplashScreen" "$APP_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string レシートを撮影して家計簿に記録するためにカメラを使用します。" "$APP_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$APP_PATH/Info.plist"
            echo "✅ Info.plist generated"
          fi
          
          # 最終確認
          echo "=== Final Info.plist validation ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist"
          # 残留変数チェック
          if grep -q '\$(' "$APP_PATH/Info.plist"; then
            echo "FATAL: Unresolved variables still present!"
            cat "$APP_PATH/Info.plist"
            exit 1
          fi
          echo "✅ No unresolved variables"
          
          # IPA パッケージング (zip -y でsymlink保持)
          mkdir -p Payload
          cp -a "$APP_PATH" "Payload/$APP_NAME"
          
          echo "=== Payload structure ==="
          ls -la Payload/
          ls -la "Payload/$APP_NAME/Info.plist" 2>/dev/null || echo "WARNING: Info.plist still missing in Payload"
          
          # symlink を確認
          echo "=== Symlinks in .app ==="
          find "Payload/$APP_NAME" -type l | head -20
          
          # zip -y でsymlink をそのまま保持して圧縮
          zip -y -r -q newkakeibo-unsigned.ipa Payload
          
          # IPA の中身を検証
          echo "=== IPA contents (top entries) ==="
          unzip -l newkakeibo-unsigned.ipa | head -30
          
          echo "=== Checking for Info.plist in IPA ==="
          unzip -l newkakeibo-unsigned.ipa | grep "Info.plist"
          
          echo "IPA size: $(du -h newkakeibo-unsigned.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: newkakeibo-ios-unsigned
          path: newkakeibo-unsigned.ipa
          retention-days: 30

  # ═══════════════════════════════════════════
  # Android: Debug APK
  # ═══════════════════════════════════════════
  build-android:
    name: Android Build (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: newkakeibo-android
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
