name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-ios:
    name: iOS Build (unsigned IPA)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove expo-dev-client for unsigned build
        run: npx expo install --fix && npm uninstall expo-dev-client

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS app (unsigned)
        run: |
          cd ios
          xcodebuild build \
            -workspace newkakeibo.xcworkspace \
            -scheme newkakeibo \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            INFOPLIST_EXPAND_BUILD_SETTINGS=YES \
            ENABLE_PREVIEWS=NO \
            2>&1 | tail -50

      - name: Package IPA for Sideloadly
        run: |
          APP_PATH=$(find ios/build/Build/Products -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "FATAL: .app not found"
            find ios/build -maxdepth 5 -type d
            exit 1
          fi

          APP_NAME=$(basename "$APP_PATH")
          echo "Using app bundle: $APP_NAME"

          echo "=== Build app summary ==="
          ls -la "$APP_PATH" | head -20

          # Payload へ symlink を実体化してコピー（Sideloadly互換性向上）
          mkdir -p Payload
          mkdir -p "Payload/$APP_NAME"
          rsync -aL "$APP_PATH/" "Payload/$APP_NAME/"

          echo "=== Symlink check in Payload (must be empty) ==="
          find "Payload/$APP_NAME" -type l | head -20

          # Info.plist 内の未解決変数を解消
          if [ -f "Payload/$APP_NAME/Info.plist" ]; then
            sed -i '' \
              -e 's/\$(PRODUCT_BUNDLE_IDENTIFIER)/com.newkakeibo.app/g' \
              -e 's/\$(PRODUCT_NAME:rfc1034identifier)/newkakeibo/g' \
              -e 's/\$(PRODUCT_NAME)/newkakeibo/g' \
              -e 's/\$(PRODUCT_MODULE_NAME)/newkakeibo/g' \
              -e 's/\$(MARKETING_VERSION)/1.0.0/g' \
              -e 's/\$(CURRENT_PROJECT_VERSION)/1/g' \
              -e 's/\$(DEVELOPMENT_TEAM)//g' \
              -e 's/\$([^)]*)//g' \
              "Payload/$APP_NAME/Info.plist"
          fi

          # stale signature を除去（Sideloadlyで再署名）
          find "Payload/$APP_NAME" -name "_CodeSignature" -type d -prune -exec rm -rf {} + 2>/dev/null || true

          echo "=== Validate app metadata ==="
          plutil -lint "Payload/$APP_NAME/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "Payload/$APP_NAME/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "Payload/$APP_NAME/Info.plist" || true

          # IPA 作成
          zip -r -q newkakeibo-unsigned.ipa Payload

          echo "=== IPA entries ==="
          unzip -l newkakeibo-unsigned.ipa | grep -E "Payload/.+\.app/$|Info\.plist|Frameworks" | head -30
          echo "IPA size: $(du -h newkakeibo-unsigned.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: newkakeibo-ios-unsigned
          path: newkakeibo-unsigned.ipa
          retention-days: 30

