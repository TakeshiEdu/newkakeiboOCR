name: Build iOS & Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  # ═══════════════════════════════════════════
  # iOS: unsigned IPA (Sideloadly/AltStore用)
  # ═══════════════════════════════════════════
  build-ios:
    name: iOS Build (unsigned IPA)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove expo-dev-client for unsigned build
        run: npx expo install --fix && npm uninstall expo-dev-client

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS app (unsigned)
        run: |
          cd ios
          xcodebuild build \
            -workspace newkakeibo.xcworkspace \
            -scheme newkakeibo \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_PREVIEWS=NO \
            2>&1 | tail -50

      - name: Debug and Package IPA
        run: |
          echo "=== Searching for .app bundles ==="
          find ios/build -name "*.app" -type d 2>/dev/null
          
          APP_PATH=$(find ios/build/Build/Products -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "FATAL: No .app found anywhere in ios/build"
            find ios/build -maxdepth 5 -type d
            exit 1
          fi
          
          echo "Found .app at: $APP_PATH"
          APP_NAME=$(basename "$APP_PATH")
          echo "App bundle name: $APP_NAME"
          
          echo "=== Top-level .app contents ==="
          ls -la "$APP_PATH/"
          
          # ---- Info.plist 修正 ----
          echo "=== Fixing Info.plist ==="
          if [ -f "$APP_PATH/Info.plist" ]; then
            # 未解決 Xcode 変数を sed で解決
            sed -i '' \
              -e 's/\$(PRODUCT_BUNDLE_IDENTIFIER)/com.newkakeibo.app/g' \
              -e 's/\$(PRODUCT_NAME:rfc1034identifier)/newkakeibo/g' \
              -e 's/\$(PRODUCT_NAME)/newkakeibo/g' \
              -e 's/\$(PRODUCT_MODULE_NAME)/newkakeibo/g' \
              -e 's/\$(MARKETING_VERSION)/1.0.0/g' \
              -e 's/\$(CURRENT_PROJECT_VERSION)/1/g' \
              -e 's/\$(DEVELOPMENT_TEAM)//g' \
              -e 's/\$([^)]*)//g' \
              "$APP_PATH/Info.plist"
            echo "Resolved Info.plist:"
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist"
          else
            echo "No Info.plist - copying from prebuild"
            cp "ios/newkakeibo/Info.plist" "$APP_PATH/Info.plist"
            sed -i '' \
              -e 's/\$(PRODUCT_BUNDLE_IDENTIFIER)/com.newkakeibo.app/g' \
              -e 's/\$(PRODUCT_NAME:rfc1034identifier)/newkakeibo/g' \
              -e 's/\$(PRODUCT_NAME)/newkakeibo/g' \
              -e 's/\$(PRODUCT_MODULE_NAME)/newkakeibo/g' \
              -e 's/\$(MARKETING_VERSION)/1.0.0/g' \
              -e 's/\$(CURRENT_PROJECT_VERSION)/1/g' \
              -e 's/\$(DEVELOPMENT_TEAM)//g' \
              -e 's/\$([^)]*)//g' \
              "$APP_PATH/Info.plist"
          fi
          plutil -lint "$APP_PATH/Info.plist"
          
          # ---- Frameworks 内 Info.plist も変数解決 ----
          echo "=== Fixing Framework Info.plists ==="
          find "$APP_PATH/Frameworks" -name "Info.plist" -type f 2>/dev/null | while read plist; do
            sed -i '' 's/\$([^)]*)//g' "$plist" 2>/dev/null || true
          done
          
          # ---- Ad-hoc 署名 (Sideloadly が再署名するために必要) ----
          echo "=== Ad-hoc signing all binaries ==="
          
          # 1. Frameworks 内の dylib / framework を先に署名
          find "$APP_PATH/Frameworks" -name "*.framework" -type d 2>/dev/null | while read fw; do
            echo "  Signing framework: $(basename "$fw")"
            codesign --force --sign - --timestamp=none "$fw" 2>&1 || true
          done
          
          find "$APP_PATH/Frameworks" -name "*.dylib" -type f 2>/dev/null | while read dl; do
            echo "  Signing dylib: $(basename "$dl")"
            codesign --force --sign - --timestamp=none "$dl" 2>&1 || true
          done
          
          # 2. PlugIns / Extensions
          find "$APP_PATH/PlugIns" -name "*.appex" -type d 2>/dev/null | while read ext; do
            echo "  Signing extension: $(basename "$ext")"
            codesign --force --sign - --timestamp=none "$ext" 2>&1 || true
          done
          
          # 3. メインバイナリを署名
          echo "  Signing main app bundle..."
          codesign --force --sign - --timestamp=none "$APP_PATH" 2>&1
          
          # 署名確認
          echo "=== Verify codesign ==="
          codesign -vv "$APP_PATH" 2>&1 || true
          
          # ---- IPA パッケージング ----
          echo "=== Packaging IPA ==="
          mkdir -p Payload
          cp -a "$APP_PATH" "Payload/$APP_NAME"
          
          # zip -y でsymlink保持
          zip -y -r -q newkakeibo-unsigned.ipa Payload
          
          # IPA 検証
          echo "=== IPA verification ==="
          unzip -l newkakeibo-unsigned.ipa | grep -E "Info\.plist|_CodeSignature" | head -10
          echo "IPA size: $(du -h newkakeibo-unsigned.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: newkakeibo-ios-unsigned
          path: newkakeibo-unsigned.ipa
          retention-days: 30

  # ═══════════════════════════════════════════
  # Android: Debug APK
  # ═══════════════════════════════════════════
  build-android:
    name: Android Build (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: newkakeibo-android
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
